apiVersion: v1
kind: Secret
metadata:
  name: bookly-backend-secrets
  namespace: default
type: Opaque
stringData:
  # =========================================================================
  # DATABASE CONFIGURATION
  # =========================================================================
  # Connection string to your PostgreSQL instance (Cloud SQL or In-Cluster)
  DATABASE_URL: "postgresql://bookly:bookly_secret@postgres-service:5432/bookly_db?schema=public"

  # =========================================================================
  # JWT AUTHENTICATION SECRETS
  # =========================================================================
  # Must be random, highly secure strings of at least 32 characters
  JWT_ACCESS_SECRET: "PLACEHOLDER_JWT_ACCESS_SECRET_MIN_32_CHARS"
  JWT_REFRESH_SECRET: "PLACEHOLDER_JWT_REFRESH_SECRET_MIN_32_CHARS"

  # =========================================================================
  # GOOGLE OAUTH CREDENTIALS (FOR GOOGLE CALENDAR)
  # =========================================================================
  GOOGLE_CLIENT_ID: "PLACEHOLDER_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "PLACEHOLDER_GOOGLE_CLIENT_SECRET"

  # =========================================================================
  # SMTP CONFIGURATION (TRANSACTIONAL EMAILS)
  # =========================================================================
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "PLACEHOLDER_SMTP_USER@gmail.com"
  SMTP_PASS: "PLACEHOLDER_SMTP_APP_PASSWORD"
  EMAIL_FROM: "Bookly <noreply@bookly.com>"

  # =========================================================================
  # GENERAL API CONFIGURATION
  # =========================================================================
  NODE_ENV: "production"
  PORT: "3000"
  CORS_ORIGIN: "http://localhost:4200" # Update in production to match frontend URL
